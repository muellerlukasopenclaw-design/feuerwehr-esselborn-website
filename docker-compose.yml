version: '3.8'

services:
  feuerwehr-website:
    image: ghcr.io/muellerlukasopenclaw-design/feuerwehr-esselborn-website:latest
    container_name: feuerwehr-esselborn-website
    restart: unless-stopped
    ports:
      - "8080:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.feuerwehr.rule=Host(`feuerwehr.gemeinde-esselborn.de`) || Host(`feuerwehr.müller-lukas.de`)"
      - "traefik.http.routers.feuerwehr.entrypoints=websecure"
      - "traefik.http.routers.feuerwehr.tls.certresolver=letsencrypt"
      - "traefik.http.services.feuerwehr.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    external: true
